<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Master Settings — Vendix</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header"><h1>Vendix</h1></div>
      <nav id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="user-info"><strong id="user-name"></strong><span class="role-badge" id="user-role"></span></div>
        <button id="logout-btn" class="btn-secondary">Log out</button>
      </div>
    </aside>
    <main class="main-content">
      <h2>Master Settings</h2>
      <p class="page-subtitle" id="readonly-note" style="display:none;">Read-only view — only admins can edit RTM categories and customer tagging.</p>
      <div id="error-box" class="alert-error" style="display:none;"></div>

      <div class="panel-grid">
        <div class="panel">
          <h3>RTM Categories</h3>
          <table><thead><tr><th>Name</th></tr></thead><tbody id="rtm-table-body"></tbody></table>
          <form class="inline-form" id="rtm-form" style="display:none;">
            <input id="rtm-input" placeholder="New RTM category name" />
            <button type="submit" class="btn-secondary">Add</button>
          </form>
        </div>

        <div class="panel panel-wide">
          <h3>Customer Tagging</h3>
          <input class="search-input" id="customer-search" placeholder="Search customers..." />
          <table><thead><tr><th>Customer</th><th>RTM Category</th></tr></thead><tbody id="customer-table-body"></tbody></table>
          <form class="inline-form" id="customer-form" style="display:none;">
            <input id="customer-name-input" placeholder="New customer name" />
            <select id="customer-rtm-select"><option value="">Uncategorized</option></select>
            <button type="submit" class="btn-secondary">Add</button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
