<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoice Search — Vendix</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header"><span class="brand-mark">V</span><h1>Vendix</h1></div>
      <nav id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="user-info"><strong id="user-name"></strong><span class="role-badge" id="user-role"></span></div>
        <button id="logout-btn" class="btn-secondary">Log out</button>
      </div>
    </aside>
    <main class="main-content">
      <h2>Invoice Search</h2>
      <p class="page-subtitle">Look up every unit under one PFI / Invoice number — shipment, customer, and activation status.</p>

      <form class="search-bar" id="search-form">
        <input id="invoice-input" placeholder="Enter PFI / Invoice number" required />
        <button type="submit" class="btn-primary">Search</button>
      </form>

      <div id="error-box" class="alert-error" style="display:none;"></div>
      <div id="results"></div>
    </main>
  </div>

  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/invoiceSearch.js"></script>
</body>
</html>
