<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PSI Pivot — Vendix</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jquery-ui-dist@1.13.2/jquery-ui.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pivottable@2.23.0/dist/pivot.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery-ui-dist@1.13.2/jquery-ui.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pivottable@2.23.0/dist/pivot.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header"><span class="brand-mark">V</span><h1>Vendix</h1></div>
      <nav id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="user-info"><strong id="user-name"></strong><span class="role-badge" id="user-role"></span></div>
        <button id="logout-btn" class="btn-secondary">Log out</button>
      </div>
    </aside>
    <main class="main-content">
      <p class="page-eyebrow">PSI Files</p>
      <h2>PSI Pivot</h2>
      <p class="page-subtitle">
        Sell-In, Sell-Through, Inventory, and Shipment Plan, all in one flat table. Use a preset for the
        common breakdowns, or switch to Custom to drag fields into Rows / Columns / Values yourself.
      </p>

      <div class="filter-bar" id="psi-pivot-filters">
        <div class="toggle-group" id="psi-pivot-period-toggle">
          <button class="toggle-btn" data-period="week">This Week</button>
          <button class="toggle-btn" data-period="month">This Month</button>
          <button class="toggle-btn" data-period="quarter">This Quarter</button>
          <button class="toggle-btn active" data-period="all">All Time</button>
        </div>
      </div>

      <div id="error-box" class="alert-error" style="display:none;"></div>
      <div id="psi-pivot-stats"></div>

      <div class="toggle-group" id="psi-pivot-tabs" style="margin-top:20px;">
        <button class="toggle-btn active" data-tab="presets">Presets</button>
        <button class="toggle-btn" data-tab="custom">Custom — drag &amp; drop</button>
      </div>

      <div id="tab-presets" style="margin-top:16px;">
        <div class="filter-bar" id="psi-pivot-preset-bar">
          <div class="toggle-group" id="psi-pivot-preset-toggle">
            <button class="toggle-btn active" data-preset="lob">By LOB</button>
            <button class="toggle-btn" data-preset="source">By Source</button>
            <button class="toggle-btn" data-preset="location">By Location</button>
            <button class="toggle-btn" data-preset="partno">By Part No</button>
          </div>
          <div class="toggle-group" id="psi-pivot-metric-toggle">
            <button class="toggle-btn active" data-metric="qty">Qty</button>
            <button class="toggle-btn" data-metric="value">Value</button>
          </div>
          <button class="btn-secondary" id="export-pivot-btn">Export to Excel</button>
        </div>
        <div id="psi-pivot-preset-content"><div class="loading">Loading pivot data...</div></div>
      </div>

      <div id="tab-custom" style="display:none; margin-top:16px;">
        <div class="panel pro-panel">
          <div id="pivot-output"><div class="loading">Loading pivot data...</div></div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/psiPivot.js"></script>
</body>
</html>
